[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan optimize && php -S 0.0.0.0:$PORT -t public"
